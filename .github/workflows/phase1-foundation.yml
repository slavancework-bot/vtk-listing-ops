name: Phase 1 Foundation
on:
  pull_request:
  push:
    branches: [agent/phase-1-production-foundation]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vtk_test
          POSTGRES_PASSWORD: vtk_test
          POSTGRES_DB: vtk_phase1_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vtk_test -d vtk_phase1_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vtk_test:vtk_test@127.0.0.1:5432/vtk_phase1_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm --filter @workspace/api-server test:postgres
